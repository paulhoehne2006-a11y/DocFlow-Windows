name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release-Version erstellen (z. B. v1.0.0) – leer lassen für einen normalen Build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer and portable exe
        run: npx electron-builder --win --x64 --publish never

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DocFlow-Studio-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release != '' && inputs.release || github.ref_name }}
          name: DocFlow Studio für Windows ${{ inputs.release != '' && inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          body_path: RELEASE_NOTES.md
