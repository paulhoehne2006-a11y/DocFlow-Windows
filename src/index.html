<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: 'wasm-unsafe-eval'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; worker-src 'self' file: blob:; connect-src 'self' file: blob: data:">
  <title>DocFlow Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Setup: pick the synced cloud folder -->
  <section id="setup" class="screen" hidden>
    <div class="setup-card">
      <div class="brand"><span class="logo"></span><span data-t="appName"></span></div>
      <h1 data-t="setupTitle"></h1>
      <p class="muted" data-t="setupText"></p>
      <div id="setup-list" class="setup-list"></div>
      <button id="setup-other" class="btn ghost" data-t="setupOther"></button>
      <p class="hint" data-t="setupHintGoogle"></p>
    </div>
  </section>

  <!-- Library -->
  <section id="library" class="screen" hidden>
    <header class="topbar">
      <div class="brand"><span class="logo"></span><span data-t="appName"></span></div>
      <input id="search" class="search" type="search" data-t-placeholder="search">
      <div class="spacer"></div>
      <button id="btn-open-pdf" class="btn ghost"><svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14H6z M14 2v6h6" /></svg><span data-t="openPdf"></span></button>
      <button id="btn-new" class="btn primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg><span data-t="newNotebook"></span></button>
    </header>
    <div class="folder-bar">
      <svg viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z" /></svg>
      <span id="folder-path" class="folder-path"></span>
      <button id="btn-reveal" class="link" data-t="showFolder"></button>
      <button id="btn-change-folder" class="link" data-t="changeFolder"></button>
    </div>
    <main id="grid" class="grid"></main>
    <div id="empty" class="empty" hidden>
      <div class="empty-art"></div>
      <h2 data-t="emptyLibraryTitle"></h2>
      <p class="muted" data-t="emptyLibraryText"></p>
    </div>
  </section>

  <!-- Editor -->
  <section id="editor" class="screen" hidden>
    <header class="toolbar">
      <button id="btn-back" class="icon-btn" data-t-title="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></button>
      <div class="title-wrap">
        <div id="nb-title" class="nb-title"></div>
        <div id="save-status" class="save-status"></div>
      </div>
      <div class="sep"></div>
      <div id="tools" class="tools"></div>
      <div class="sep"></div>
      <div id="tool-options" class="tool-options"></div>
      <div class="spacer"></div>
      <button id="btn-delete-sel" class="btn danger small" hidden data-t="deleteSelection"></button>
      <button id="btn-undo" class="icon-btn" data-t-title="undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" /></svg></button>
      <button id="btn-redo" class="icon-btn" data-t-title="redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3" /></svg></button>
      <div class="sep"></div>
      <button id="btn-layers" class="icon-btn" data-t-title="layers"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z M3 13l9 5 9-5" /></svg></button>
      <button id="btn-more" class="icon-btn" data-t-title="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="12" cy="19" r="1.6" /></svg></button>
    </header>
    <div class="workspace">
      <div id="stage" class="stage">
        <canvas id="view"></canvas>
        <canvas id="wet"></canvas>
      </div>
      <aside id="layers-panel" class="panel" hidden>
        <div class="panel-head"><span data-t="layers"></span>
          <button id="btn-add-layer" class="icon-btn small" data-t-title="addLayer"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></button>
        </div>
        <div id="layer-list" class="layer-list"></div>
      </aside>
      <div class="page-nav">
        <button id="btn-zoom-out" class="icon-btn small" data-t-title="zoomOut"><svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg></button>
        <button id="btn-fit" class="pill" data-t-title="fitWidth"><span id="zoom-label">100 %</span></button>
        <button id="btn-zoom-in" class="icon-btn small" data-t-title="zoomIn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></button>
        <span class="sep"></span>
        <span id="page-label" class="page-label"></span>
        <button id="btn-add-page" class="icon-btn small" data-t-title="addPage"><svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14H6z M13 12v6M10 15h6" /></svg></button>
      </div>
    </div>
    <div id="more-menu" class="menu" hidden>
      <button id="menu-export" data-t="exportPdf"></button>
      <button id="menu-fullscreen" data-t="fullscreen"></button>
      <label class="check"><input id="opt-barrel" type="checkbox"><span data-t="barrelErases"></span></label>
      <label class="check"><input id="opt-finger" type="checkbox"><span data-t="fingerDraws"></span></label>
    </div>
  </section>

  <dialog id="dialog" class="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost" data-t="cancel" formnovalidate></button>
        <button value="ok" id="dialog-ok" class="btn primary" data-t="ok"></button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
